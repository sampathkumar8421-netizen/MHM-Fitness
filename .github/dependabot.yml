version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm. Grouped so one review covers a week of patch drift instead of five PRs.
  # Majors are deliberately NOT grouped: `three` and `vite` major bumps can change
  # rendering or build behaviour, so they arrive alone and must pass CI on their own.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    labels:
      - dependencies
    groups:
      fonts:
        patterns:
          - "@fontsource*"
        update-types:
          - minor
          - patch
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Actions used by the workflows in this directory.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
